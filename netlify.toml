[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Country-level geolocation for js/analytics.js — uses Netlify's own edge
# geo data (no third-party IP-lookup service, no API key), fetched once per
# session and attached to every analytics event. See
# netlify/edge-functions/geo.js.
[[edge_functions]]
  path = "/api/geo"
  function = "geo"

# Internal-only pipeline scripts (Python upload/build tools) were being
# served as plain static files — a hardcoded Supabase secret key and R2
# secret were downloadable straight from the live site until this was found
# and fixed (see env_secrets.py). No [build] publish dir exists to scope
# what's public, so block these explicitly instead; force=true because a
# real file exists at each path and would otherwise be served directly.
# New internal scripts should live under tools/ (already blocked below),
# never loose at the repo root.
# Guides answered 200 on /guides/<slug>/index.html as well as /guides/<slug>/
# (duplicate URL). Only the request path is matched, so /guides/<slug>/ itself
# still resolves to its index.html without looping.
# Pinterest auto-publish: one RSS feed per board, served by pin-feed.js, which
# only lists pins whose scheduled day has come (netlify/lib/pin-schedule.json,
# built by tools/pinterest/build_schedule.js). Pinterest reads each feed daily.
[[redirects]]
  from = "/pinterest/feed/:board"
  to = "/.netlify/functions/pin-feed?board=:board"
  status = 200
  force = true

[[redirects]]
  from = "/guides/index.html"
  to = "/guides/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/:slug/index.html"
  to = "/guides/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/:section/:slug/index.html"
  to = "/guides/:section/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

# Function/edge-function source (netlify/functions, netlify/lib) was being
# served as plain files at /netlify/... (no secrets — those are env vars — but
# it exposes webhook and upload logic). /.netlify/functions/* is unaffected.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/env_secrets.py"
  to = "/"
  status = 404
  force = true

