[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Report-Only first: observe violations in the browser console for a
    # while (nothing gets blocked) before ever switching this to an
    # enforcing Content-Security-Policy. 'unsafe-inline' is required for now
    # since the site relies heavily on inline <script>/onclick — tightening
    # that is a separate, bigger refactor, not a one-line change.
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: https://*.supabase.co https://files.workshido.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://files.workshido.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS/CSS are referenced by unversioned filenames (js/workshido-index.js, etc.),
# so they must NOT be cached "immutable" — that pinned old copies on returning
# devices (esp. mobile) for up to a year, so a deployed bug fix never reached
# them. Revalidate on every load instead: a conditional request returns a tiny
# 304 when unchanged, but picks up new code immediately after a deploy.
# (The ?v= query on each <script src> additionally busts any copy already
# cached under the previous immutable header.)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
