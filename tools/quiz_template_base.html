<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito', 'Arial', sans-serif; font-size: 11.3px; color: #000; background: #fff; }

  .page-wrap { padding: 4px 28px 0; }

  /* HEADER — plain white, no color band (no brand name — that lives on the teacher's Answer Key) */
  .header { text-align: center; margin-bottom: 0; }
  .header .eyebrow { font-size: 9.5px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #1a3a5c; }
  .header .ws-title { margin-top: 2px; font-size: 17px; font-weight: 900; color: #1a3a5c; }
  .header .ws-subtitle { margin-top: 1px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #1a3a5c; }

  .header-rule { border-bottom: 2px solid #1a3a5c; margin-bottom: 1px; }

  /* STUDENT INFO CARD — the card border is the writing boundary, no inner line needed */
  .student-card { display: grid; grid-template-columns: 2.2fr 0.7fr 1.3fr 1.1fr; border: 1px solid #1a3a5c; border-radius: 9px; overflow: hidden; margin-bottom: 1px; }
  .student-card > div { padding: 2px 12px 4px; border-right: 1px solid #1a3a5c; }
  .student-card > div:last-child { border-right: none; }
  .student-card label { display: block; font-size: 7px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #1a3a5c; }

  /* LEARNING OBJECTIVE */
  .obj-box { background: #fff; border: 1px solid #1a3a5c; border-left: 3px solid #1a3a5c; border-radius: 8px; padding: 0 12px; margin-bottom: 1px; font-size: 9.8px; line-height: 1.2; }
  .obj-box b { text-transform: uppercase; letter-spacing: 0.4px; font-size: 8.8px; color: #1a3a5c; }

  .info-line { font-size: 9.3px; color: #1a3a5c; margin-bottom: 1px; text-align: center; }
  .info-line b { color: #1a3a5c; }

  /* SECTION TITLES — circular letter badge like a premium test paper */
  .section-title { display: flex; align-items: center; gap: 8px; border-bottom: 1.5px solid #1a3a5c; padding-bottom: 0; margin-bottom: 1px; }
  .section-title .letter-badge { width: 17px; height: 17px; min-width: 17px; border-radius: 50%; background: #1a3a5c; color: #fff; font-size: 9.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .section-title .title-text { flex: 1; font-size: 11.5px; font-weight: 800; color: #1a3a5c; text-transform: uppercase; letter-spacing: 0.3px; }
  .section-title .badge { font-size: 8.8px; font-weight: 700; color: #1a3a5c; white-space: nowrap; }
  .section-title .badge .earn { display: inline-block; min-width: 24px; border-bottom: 1px solid #1a3a5c; margin: 0 2px; }

  /* QUIZ SECTION WRAPPER */
  .quiz-section { margin-bottom: 0; break-inside: avoid; page-break-inside: avoid; }
  .quiz-body { padding: 0 2px 0 25px; }
  .instructions { font-size: 9.3px; font-style: italic; color: #1a3a5c; margin-bottom: 0; }

  /* COMMON QUESTION FORMATS */
  .quiz-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 18px; }
  .q-item { font-size: 10.6px; line-height: 1.35; }
  .q-item .n { font-weight: 800; color: #1a3a5c; margin-right: 3px; }
  .mc-options { display: inline-flex; gap: 10px; margin-left: 6px; }
  .mc-options span { white-space: nowrap; }
  .blank { display: inline-block; min-width: 100px; border-bottom: 1px solid #5d7a96; margin: 0 3px; }
  .ans-line { border-bottom: 1px solid #5d7a96; height: 10px; margin: 1px 4px 1px 0; }
  .write-lines div { border-bottom: 1px solid #5d7a96; height: 10px; margin-bottom: 2px; }
  .reading-box { border: 1px solid #1a3a5c; background: #fff; border-radius: 7px; padding: 2px 11px; margin-bottom: 1px; font-size: 9.5px; line-height: 1.15; }

  /* TOTAL SCORE RECAP */
  .total-score-box { display: flex; justify-content: space-between; align-items: center; border: 1.5px solid #1a3a5c; border-radius: 9px; padding: 1px 16px; margin: 1px 0 0; background: #fff; }
  .total-score-box .label { font-size: 9.5px; font-weight: 900; letter-spacing: 1px; color: #1a3a5c; text-transform: uppercase; }
  .total-score-box .value { font-size: 9px; font-weight: 700; color: #1a3a5c; }
  .total-score-box .value b { font-size: 12px; }
  .total-score-box .grade { font-size: 9px; font-weight: 700; color: #1a3a5c; margin-left: 18px; }
  .total-score-box .grade .fill { display: inline-block; min-width: 45px; border-bottom: 1px solid #5d7a96; margin-left: 4px; }

  /* FOOTER */
  .footer { text-align: center; margin-top: 0; padding-top: 0; border-top: 1px solid #1a3a5c; font-size: 7px; color: #1a3a5c; letter-spacing: 0.5px; }
</style>
</head>
<body>

<!-- ═══════════════════════ STUDENT QUIZ (print-ready, no answers, no branding) ═══════════════════════ -->

<div class="page-wrap">

<div class="header">
  <div class="eyebrow">Quiz</div>
  <div class="ws-title">{{WS_TITLE}}</div>
  <div class="ws-subtitle">{{SKILLS_TEXT}}</div>
</div>
<div class="header-rule"></div>

<div class="student-card">
  <div><label>Name</label></div>
  <div><label>Class</label></div>
  <div><label>Date</label></div>
  <div><label>Score</label></div>
</div>

<div class="obj-box">
  <b>Learning Objective ({{LEVEL}})</b> &mdash; {{LEARNING_OBJECTIVE}}
</div>

<div class="info-line">
<!--INFO_START-->
  {{INFO_ROWS}}
<!--INFO_END-->
</div>

{{SECTIONS}}

<div class="total-score-box">
  <span class="label">Total Score</span>
  <span class="value">___ <b>/ {{TOTAL_POINTS}}</b></span>
  <span class="grade">Grade:<span class="fill"></span></span>
</div>

<div class="footer">workshido.com</div>

</div>

</body>
</html>
