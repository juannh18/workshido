<!DOCTYPE html>
<!-- Plantilla de pin 1000×1500 (2:3). La pinta tools/pinterest/render_pins.py:
     navega a este archivo con #<json> en el hash y captura la pantalla.
     Estilo copiado de los pines que ya tenía la cuenta (franja azul marino,
     título grande en mayúsculas, ficha al centro, botón morado). -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Sora; src: url('../../fonts/sora-latin.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Inter; src: url('../../fonts/inter-latin.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; }
  body { background: #042C53; font-family: Inter, Arial, sans-serif; color: #fff; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(900px 600px at 50% 62%, rgba(55,138,221,.28), transparent 70%); }
  .head { position: absolute; top: 70px; left: 80px; right: 80px; }
  .label { font-weight: 800; font-size: 30px; letter-spacing: 4px; color: #85B7EB; text-transform: uppercase; }
  .title { font-family: Sora, Inter, sans-serif; font-weight: 800; line-height: 1.02; text-transform: uppercase; margin-top: 18px; font-size: 92px; letter-spacing: -1px; }
  .sub { font-weight: 600; font-size: 36px; color: #E6F1FB; margin-top: 16px; line-height: 1.25; }
  .stage { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; }
  .sheet { background: #fff; border-radius: 10px; box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.15); overflow: hidden; }
  .sheet img { display: block; width: 100%; height: auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .grid .sheet { width: 330px; }
  .badge { position: absolute; background: #EF9F27; color: #2C2C2A; font-weight: 900; font-size: 30px; line-height: 1.05; text-align: center; padding: 18px 22px; border-radius: 14px; transform: rotate(6deg); box-shadow: 0 10px 24px rgba(0,0,0,.35); letter-spacing: .5px; }
  .skills { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 32px; color: #B5D4F4; letter-spacing: 1px; }
  .cta { position: absolute; left: 110px; right: 110px; bottom: 130px; height: 110px; border-radius: 22px; background: #534AB7; display: flex; align-items: center; justify-content: center; font-family: Sora, Inter, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: 1px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .site { position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; font-weight: 800; font-size: 38px; letter-spacing: 1px; }
  .site span { color: #85B7EB; }
</style></head>
<body>
<div class="glow"></div>
<div class="head">
  <div class="label" id="label"></div>
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
</div>
<div class="stage" id="stage"></div>
<div class="skills" id="skills"></div>
<div class="cta" id="cta"></div>
<div class="site">work<span>shido</span>.com</div>
<script>
// Params: {type:'WORKSHEET'|'SET', label, title, sub, cta, thumbs:[url...], skills}
const p = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const $ = (id) => document.getElementById(id);
$('label').textContent = p.label;
$('title').textContent = p.title;
$('sub').textContent = p.sub || '';
$('cta').textContent = p.cta;

// Title: shrink until the header block fits its band (max 3 lines).
const head = document.querySelector('.head');
let fs = 92;
const maxHead = p.type === 'SET' ? 400 : 380;
while ((head.offsetHeight > maxHead || $('title').offsetHeight > fs * 1.02 * 3 + 4) && fs > 46) {
  fs -= 4; $('title').style.fontSize = fs + 'px';
}
if (!p.sub) $('sub').style.display = 'none';

const headBottom = 70 + head.offsetHeight;
const stage = $('stage');
const ctaTop = 1500 - 130 - 110;
let loads = [];
function img(u) {
  const d = document.createElement('div'); d.className = 'sheet';
  const i = new Image(); i.src = u;
  loads.push(new Promise((r) => { i.onload = r; i.onerror = r; }));
  d.appendChild(i); return d;
}
if (p.type === 'SET') {
  const g = document.createElement('div'); g.className = 'grid';
  p.thumbs.slice(0, 4).forEach((u) => g.appendChild(img(u)));
  stage.appendChild(g);
  $('skills').textContent = p.skills || 'Grammar · Reading · Writing · Practice';
} else {
  stage.appendChild(img(p.thumbs[0]));
  const b = document.createElement('div'); b.className = 'badge'; b.innerHTML = 'FREE<br>PDF';
  document.body.appendChild(b);
  $('skills').style.display = 'none';
}
Promise.all([document.fonts.ready, ...loads]).then(() => {
  // Fit the preview(s) between the header and the button.
  const gapTop = headBottom + 40, gapBottom = ctaTop - (p.type === 'SET' ? 90 : 40);
  const avail = gapBottom - gapTop;
  if (p.type === 'SET') {
    const g = stage.firstChild;
    const scale = Math.min(1, avail / g.offsetHeight);
    g.style.transform = `scale(${scale})`;
    stage.style.top = gapTop + 'px'; stage.style.height = avail + 'px';
    $('skills').style.top = (gapBottom + 22) + 'px';
  } else {
    const s = stage.firstChild;
    const ratio = s.offsetHeight / s.offsetWidth || 1.414;
    const w = Math.min(700, avail / ratio);
    s.style.width = w + 'px';
    stage.style.top = gapTop + 'px'; stage.style.height = avail + 'px';
    const b = document.querySelector('.badge');
    const left = (1000 - w) / 2;
    // Bottom-right corner: the top of every worksheet carries its printed title,
    // which the badge must never cover.
    const top = gapTop + (avail - w * ratio) / 2;
    b.style.left = (left + w - 110) + 'px'; b.style.top = (top + w * ratio - 70) + 'px';
  }
  window.__ready = true;
});
</script>
</body></html>
