<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito', 'Arial', sans-serif; font-size: 10.6px; color: #1a1a2e; background: #fff; padding: 8px 30px 4px; }

  /* ---------- Header (same brand language as the Teacher Edition) ---------- */
  .header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 6px; border-bottom: 3px solid #1a3a5c; margin-bottom: 6px; }
  .header-left .brand-row { display: flex; align-items: center; gap: 8px; }
  .header-left .brand-logo { width: 24px; height: 24px; border-radius: 6px; }
  .header-left .brand-mini { font-size: 18px; font-weight: 900; letter-spacing: 0.3px; color: #1a3a5c; }
  .header-left .brand-mini .brand-accent { color: #6ea8dc; }
  .header-left .edition { font-size: 10px; font-weight: 800; color: #e67e22; margin-top: 1px; letter-spacing: 0.5px; text-transform: uppercase; }
  .header-right { text-align: right; max-width: 60%; }
  .header-right .ws-title { font-size: 14.5px; font-weight: 800; color: #1a3a5c; line-height: 1.25; }
  .header-right .ws-sub { font-size: 9.5px; color: #7a8699; margin-top: 2px; }

  /* ---------- Top panel: objective + info ---------- */
  .top-panel { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-bottom: 4px; }
  .panel-card { background: #f5f8fb; border: 1px solid #dbe4ee; border-radius: 9px; padding: 5px 14px; }
  .panel-card h3 { font-size: 9px; font-weight: 800; color: #1a3a5c; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 2px; }
  .panel-card p { font-size: 10px; line-height: 1.28; color: #33415c; }
  .wsinfo { width: 100%; border-collapse: collapse; font-size: 9.6px; }
  .wsinfo td { padding: 1px 2px; }
  .wsinfo td:first-child { font-weight: 700; color: #1a3a5c; width: 40%; text-transform: uppercase; font-size: 8.4px; letter-spacing: 0.4px; }
  .wsinfo td:last-child { color: #33415c; }
  .name-line { display: flex; gap: 18px; margin-top: 4px; padding-top: 4px; border-top: 1px solid #dbe4ee; font-size: 8.6px; color: #7a8699; }
  .name-line span { flex: 1; border-bottom: 1px solid #b9c6d6; padding-bottom: 5px; }

  /* ---------- Section blocks (colored bar + light card, matching the TE) ---------- */
  .ws-section { margin-bottom: 3px; break-inside: avoid; page-break-inside: avoid; }
  .section-title { font-size: 10.4px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; background: #1a3a5c; padding: 2.5px 12px; border-radius: 6px; margin-bottom: 3px; display: inline-block; }
  .section-title.amber { background: #e67e22; }
  .section-title.teal { background: #0e7c66; }
  .section-title.purple { background: #7b2d8b; }
  .section-title.green { background: #1e8449; }
  .section-title.red { background: #c0392b; }
  .ws-body { background: #fbfcfd; border: 1px solid #e2e8f0; border-radius: 8px; padding: 4px 14px 4px; }
  .instructions { font-size: 9.4px; font-style: italic; color: #5c6b81; margin-bottom: 2px; }

  /* ---------- Question formats (same classes as the quiz template, so JSON content is reusable) ---------- */
  .quiz-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--row-gap, 2px) 18px; }
  .q-item { font-size: 10.4px; line-height: var(--q-lh, 1.3); }
  .q-item .n { font-weight: 800; color: #1a3a5c; margin-right: 3px; }
  .mc-options { display: inline-flex; gap: 10px; margin-left: 6px; }
  .mc-options span { white-space: nowrap; }
  .blank { display: inline-block; min-width: 100px; border-bottom: 1px solid #8fa3ba; margin: 0 3px; }
  .ans-line { border-bottom: 1px solid #8fa3ba; height: var(--ans-h, 10px); margin: 0 4px 1px 0; }
  .write-lines div { border-bottom: 1px solid #8fa3ba; height: var(--write-h, 13px); margin-bottom: 2px; }
  .reading-box { border: 1px solid #cdd8e4; background: #fff; border-radius: 7px; padding: 4px 12px; margin-bottom: 3px; font-size: 9.6px; line-height: 1.28; }

  /* ---------- Footer ---------- */
  .footer { text-align: center; margin-top: 0; padding-top: 0; border-top: 1px solid #d0d8e4; font-size: 8.6px; color: #9aa5b4; letter-spacing: 0.6px; }

  /* ---------- Per-worksheet fit overrides (build_worksheet.py fills this from content['fit']) ---------- */
  {{FIT_VARS}}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="brand-row">
      <img class="brand-logo" src="{{LOGO}}" alt="Workshido">
      <div class="brand-mini">Work<span class="brand-accent">shido</span></div>
    </div>
    <div class="edition">Free Worksheet</div>
  </div>
  <div class="header-right">
    <div class="ws-title">{{WS_TITLE}}</div>
    <div class="ws-sub">{{SKILLS_TEXT}}</div>
  </div>
</div>

<div class="top-panel">
  <div class="panel-card">
    <h3>Learning Objective ({{LEVEL}})</h3>
    <p>{{LEARNING_OBJECTIVE}}</p>
    <div class="name-line"><span>Name</span><span>Class</span><span>Date</span></div>
  </div>
  <div class="panel-card">
    <h3>Worksheet Info</h3>
    <table class="wsinfo">
{{INFO_ROWS}}
    </table>
  </div>
</div>

{{SECTIONS}}

<div class="footer">workshido.com &nbsp;&bull;&nbsp; Free Worksheet</div>

</body>
</html>
